name: Release

# Runs only on tags.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Checks that need no booted machine.
  test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the build environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git openssh-client qemu-utils
      - uses: actions/checkout@v4
      - name: Install the toolchain
        # Neither distribution ships Rust for the 2024 edition.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # One failing distribution should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - distribution: trixie
            container: debian:trixie
          - distribution: noble
            container: ubuntu:24.04
    container: ${{ matrix.container }}
    steps:
      - name: Install the build environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git dpkg-dev lintian
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: Build the package
        # Fails if a claimed dependency does not exist in the distribution.
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package "${{ matrix.distribution }}" "$version" packages
      - name: Check it installs
        # Installing the package also resolves its dependencies.
        run: |
          apt-get install -y ./packages/*.deb
          vm --version
          vm images
          man -w vm
          man -w 5 vm-config
      - uses: actions/upload-artifact@v4
        with:
          name: vm-manager-${{ matrix.distribution }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Attach the packages to the release
        # Adds to the draft release `scripts/release` created.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" packages/*.deb --clobber \
            --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" packages/*.deb \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "${GITHUB_REF_NAME#v}" \
                 --generate-notes --draft

[workspace]
resolver = "3"
members = ["crates/vm-core", "crates/vm", "crates/vmg"]

[workspace.package]
version = "1.1.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Dave Minter <dave@paperstack.com>"]
repository = "https://github.com/dcminter/vm-manager"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
# Exact, because the dynamic completion engine sits behind a feature exempt from semver.
clap_complete = { version = "=4.6.9", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
basic-toml = "0.1"
sha2 = "0.11"
ureq = { version = "3", features = ["platform-verifier"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Documentation lints, against a house style that keeps prose out of the code.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
